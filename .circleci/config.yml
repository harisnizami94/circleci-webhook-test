version: 2.1

jobs:
  fail-after-running:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Plan deployment
          command: |
            circleci run release plan repro-release \
              --environment-name=repro-env \
              --component-name=repro-component \
              --target-version="1.0.${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:7}"
      - run:
          name: Update planned release to RUNNING
          command: |
            circleci run release update repro-release --status=RUNNING
      - run:
          name: Simulate deploy failure
          command: |
            echo "FAILURE_REASON='intentional failure for is_live repro'" > failure_reason.env
            exit 1
      - run:
          name: Update planned release to SUCCESS
          command: |
            circleci run release update repro-release --status=SUCCESS
          when: on_success
      - run:
          name: Update planned release to FAILED
          command: |
            if [ -f failure_reason.env ]; then
              source failure_reason.env
            fi
            circleci run release update repro-release \
              --status=FAILED \
              --failure-reason="${FAILURE_REASON:-intentional failure}"
          when: on_fail

workflows:
  is-live-repro:
    jobs:
      - fail-after-running
